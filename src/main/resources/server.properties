# ========================================
# Java TCP Chat Server Configuration
# ========================================

# Server port (TCP)
server.port=5000

# Maximum file size allowed for transfer (in bytes)
# Default: 2 GB = 2147483648
server.maxFileSize=2147483648

# Directory to temporarily store relayed files (if needed)
server.fileStorage=server_data/files

# Heartbeat interval in milliseconds (30 seconds)
heartbeat.interval=30000

# Heartbeat timeout in milliseconds (60 seconds)
heartbeat.timeout=60000

# Thread pool size (0 = cached/unlimited)
server.threadPoolSize=0
